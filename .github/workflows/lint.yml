name: lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check --select E,F,W,B,A,C4,SIM,PIE --line-length 120 --target-version py311 .
      - run: uvx pylint --disable=all --enable=duplicate-code --min-similarity-lines=5 moblend mcp tests examples
